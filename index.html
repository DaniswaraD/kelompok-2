<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Ekonomi Komando - Kelompok 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b4:#5b9cf5;--b5:#2f6fdb;--ink:#15305c;--mut:#566e95}
*{box-sizing:border-box;margin:0}
html{font-size:min(1.7vh,.95vw)}
body{height:100dvh;overflow:hidden;background:#eef5ff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-size:1.2rem}
h1,h2,h3,.tag,.btn,.cnt,.logo{font-family:'Sora','Plus Jakarta Sans',system-ui,sans-serif}
.bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 15% 10%,#fff,transparent 45%),linear-gradient(135deg,#f6faff,#dfecff 55%,#f3f8ff)}
.grid{position:absolute;inset:-10%;background-image:linear-gradient(rgba(91,156,245,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(91,156,245,.13) 1px,transparent 1px);background-size:4rem 4rem;-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 75%);mask-image:radial-gradient(circle,#000 20%,transparent 75%);animation:pan 20s linear infinite}
@keyframes pan{to{transform:translate(4rem,4rem)}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:fl 14s ease-in-out infinite alternate}
.b1{width:36rem;height:36rem;background:#a9cdff;left:-8rem;top:-10rem}
.b2{width:30rem;height:30rem;background:#cfe2ff;right:-6rem;bottom:-8rem;animation-delay:-5s}
.b3{width:20rem;height:20rem;background:#8fbcff;right:30%;top:10%;opacity:.35;animation-delay:-9s}
@keyframes fl{to{transform:translate(6rem,4rem) scale(1.2)}}
.p{position:absolute;bottom:-2rem;border-radius:50%;background:rgba(91,156,245,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh);opacity:0}}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.6rem max(3.5rem,env(safe-area-inset-right)) 0 max(3.5rem,env(safe-area-inset-left));z-index:5}
.logo{display:flex;align-items:center;gap:.9rem;font-weight:700;font-size:1.25rem}
.lm{width:2.6rem;height:2.6rem;border-radius:.9rem;background:linear-gradient(135deg,#7db4ff,#2f6fdb);display:grid;place-items:center;color:#fff}
.lm svg{width:1.4rem}
.cnt{font-weight:600;font-size:1.15rem;padding:.5rem 1.1rem;border-radius:2rem;background:rgba(255,255,255,.75);border:1px solid rgba(156,196,255,.5)}
.dots{position:fixed;bottom:1.8rem;left:50%;translate:-50% 0;display:flex;gap:.6rem;z-index:5}
.dot{width:.7rem;height:.7rem;border-radius:1rem;background:#b8d2f7;transition:all .6s cubic-bezier(.16,1,.3,1)}
.dot.on{width:2.6rem;background:var(--b5)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5.5rem max(7rem,env(safe-area-inset-right)) 4.5rem max(7rem,env(safe-area-inset-left));pointer-events:none}
.slide.active{pointer-events:auto}
.rv{transition:transform 1.1s cubic-bezier(.16,1,.3,1),opacity .9s ease-out}
.active .rv{transform:none;opacity:1;transition-delay:calc(var(--i)*90ms + 300ms)}
.next .rv{transform:translateY(120vh);opacity:0;transition:none}
.gone .rv{transform:translateY(-120vh);opacity:0;transition-delay:calc(var(--i)*70ms)}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0}
.active .c{animation:ci .8s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0)*90ms + 800ms + var(--c)*var(--k,32ms))}
@keyframes ci{from{opacity:0;transform:translateY(70%) rotate(10deg);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.tag{align-self:flex-start;display:flex;align-items:center;gap:.7rem;padding:.55rem 1.2rem;border-radius:2rem;background:rgba(255,255,255,.85);border:1px solid rgba(156,196,255,.6);font-weight:600;font-size:1.2rem;color:var(--b5)}
.tag i{width:.6rem;height:.6rem;border-radius:50%;background:var(--b4);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(91,156,245,.6)}100%{box-shadow:0 0 0 .9rem rgba(91,156,245,0)}}
h2{font-size:4.2rem;line-height:1.1;font-weight:800;margin:1rem 0 1.8rem;letter-spacing:-.02em}
h2 em{font-style:normal;color:var(--b5)}
.row{display:grid;gap:1.4rem}
.c3{grid-template-columns:repeat(3,1fr)}
.c2{grid-template-columns:repeat(2,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.card{position:relative;background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);border-radius:1.8rem;padding:1.7rem;box-shadow:0 1.2rem 3rem -1.2rem rgba(47,111,219,.35),inset 0 0 0 1px rgba(156,196,255,.35);overflow:hidden;transition:translate .5s cubic-bezier(.16,1,.3,1),box-shadow .5s}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(18rem circle at var(--mx,50%) var(--my,0%),rgba(91,156,245,.24),transparent 60%);opacity:0;transition:opacity .3s}
.card::after{content:'';position:absolute;left:0;top:0;height:.28rem;width:40%;background:linear-gradient(90deg,#7db4ff,#2f6fdb);border-radius:0 0 1rem 0;transition:width .6s cubic-bezier(.16,1,.3,1)}
.card:hover{translate:0 -.5rem;box-shadow:0 2rem 3.5rem -1.2rem rgba(47,111,219,.5),inset 0 0 0 1px rgba(125,180,255,.6)}
.card:hover::before{opacity:1}
.card:hover::after{width:100%}
.card h3{font-size:1.75rem;margin:0 0 .5rem;font-weight:700;line-height:1.25}
.card p{font-size:1.4rem;line-height:1.5;color:var(--mut)}
.ico{width:3.7rem;height:3.7rem;flex:none;border-radius:1.2rem;background:linear-gradient(135deg,#7db4ff,#2f6fdb);display:grid;place-items:center;color:#fff;box-shadow:0 .8rem 1.4rem -.5rem rgba(47,111,219,.6)}
.ico svg{width:1.9rem}
.neg .ico{background:linear-gradient(135deg,#8aa6d6,#34508a);box-shadow:0 .8rem 1.4rem -.5rem rgba(52,80,138,.6)}
.hz{display:flex;gap:1.3rem;align-items:flex-start}
.hz h3{margin-top:0}
.btn{align-self:flex-end;margin-top:2rem;display:flex;align-items:center;gap:.9rem;padding:1.1rem 2.2rem;border:0;border-radius:3rem;font-size:1.35rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#6aa8ff,#2f6fdb);box-shadow:0 1rem 2rem -.6rem rgba(47,111,219,.6);cursor:pointer;position:relative;overflow:hidden;transition:translate .3s,box-shadow .3s}
.btn svg{width:1.4rem;transition:translate .3s}
.btn:hover{translate:0 -.25rem;box-shadow:0 1.4rem 2.4rem -.6rem rgba(47,111,219,.7)}
.btn:hover svg{translate:.4rem 0}
.btn:focus-visible{outline:.25rem solid #9cc4ff;outline-offset:.2rem}
.btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.8s infinite}
@keyframes sh{to{left:130%}}
.hero{display:flex;align-items:center;gap:4rem;flex:1}
.hl{flex:1.25;display:flex;flex-direction:column;align-items:flex-start}
h1{font-size:7.5rem;line-height:1;font-weight:800;letter-spacing:-.03em;margin:1.2rem 0 .6rem;color:var(--ink)}
.sub{font-size:1.9rem;font-weight:600;color:var(--b5);margin-bottom:1.6rem;font-family:'Sora',system-ui,sans-serif}
.lab{font:700 1.3rem 'Sora',system-ui,sans-serif;color:var(--mut);margin-bottom:.8rem}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem;width:100%}
.chip{display:flex;align-items:center;gap:.9rem;padding:.65rem 1.1rem .65rem .65rem;border-radius:1.4rem;background:rgba(255,255,255,.8);border:1px solid rgba(156,196,255,.5);font-weight:600;font-size:1.25rem;transition:translate .4s,box-shadow .4s}
.chip:hover{translate:0 -.2rem;box-shadow:0 .8rem 1.6rem -.6rem rgba(47,111,219,.45)}
.chip span{width:2.4rem;height:2.4rem;border-radius:.9rem;background:linear-gradient(135deg,#bcd8ff,#5b9cf5);color:#fff;display:grid;place-items:center;flex:none}
.chip svg{width:1.3rem}
.hl .btn{align-self:flex-start}
.orb{position:relative;width:28rem;height:28rem;flex:none}
.ring{position:absolute;border:1.5px dashed rgba(91,156,245,.55);border-radius:50%;animation:spin var(--d) linear infinite}
.r1{inset:0;--d:40s}
.r2{inset:4rem;--d:28s;animation-direction:reverse}
.r3{inset:8rem;--d:20s}
.nd{position:absolute;left:50%;top:-1.5rem;width:3rem;height:3rem;margin-left:-1.5rem;border-radius:50%;background:#fff;color:var(--b5);display:grid;place-items:center;box-shadow:0 .6rem 1.4rem -.3rem rgba(47,111,219,.45)}
.nd.bt{top:auto;bottom:-1.5rem}
.nd svg{width:1.4rem;animation:spin var(--d) linear infinite reverse}
.r2 .nd svg{animation-direction:normal}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;inset:10.5rem;border-radius:2.4rem;background:linear-gradient(135deg,#8cbcff,#2f6fdb);display:grid;place-items:center;color:#fff;box-shadow:0 2rem 4rem -1rem rgba(47,111,219,.6);animation:bob 5s ease-in-out infinite}
.core svg{width:3.6rem}
@keyframes bob{50%{transform:translateY(-.8rem) rotate(4deg)}}
.def{display:grid;grid-template-columns:1.5fr 1fr;gap:1.4rem}
.big{padding:2.4rem 2.6rem;display:flex;flex-direction:column;justify-content:center}
.big p{font-size:2rem;line-height:1.6;color:var(--ink)}
.stack{display:grid;gap:1.2rem}
.stack .card{padding:1.4rem}.stack p{font-size:1.25rem}.vh{display:flex;align-items:center;gap:1.1rem;margin-bottom:1rem}.vh .ico{width:3.2rem;height:3.2rem;border-radius:1rem}.vh .ico svg{width:1.6rem}.vh h3{margin:0}
.badge{display:inline-block;margin-top:1rem;padding:.35rem .95rem;border-radius:2rem;font-size:1.15rem;font-weight:700;background:#e0edff;color:var(--b5)}
.badge.old{background:#eceff6;color:#5f6f90}
.end{align-items:center;text-align:center;justify-content:center}
.end .tag,.end .btn{align-self:center}
.end h1{font-size:9rem;margin:1.6rem 0 1rem}
.big-ico{width:7rem;height:7rem;border-radius:2.2rem}
.big-ico svg{width:3.4rem}
.halo{position:absolute;left:50%;top:50%;width:46rem;height:46rem;margin:-23rem 0 0 -23rem;border-radius:50%;border:1.5px solid rgba(91,156,245,.4);opacity:0;pointer-events:none}
.active .halo{animation:ex 5s ease-out infinite;animation-delay:calc(var(--h)*1.6s + 1s)}
@keyframes ex{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.flag{position:relative;height:9rem;border-radius:1.2rem;overflow:hidden;margin-bottom:1.2rem;box-shadow:0 .8rem 1.6rem -.6rem rgba(21,48,92,.45),inset 0 0 0 1px rgba(21,48,92,.12);transition:transform .6s cubic-bezier(.16,1,.3,1)}
.card:hover .flag{transform:scale(1.05) rotate(-1deg)}
.flag b,.flag i{position:absolute;display:block;background:#ffde00;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.f-kp{background:linear-gradient(#024fa2 0 16%,#fff 16% 20%,#ed1c27 20% 80%,#fff 80% 84%,#024fa2 84%)}
.f-kp b{left:22%;top:50%;width:5.6rem;height:5.6rem;transform:translate(-50%,-50%);border-radius:50%;background:#fff;clip-path:none}
.f-kp i{left:22%;top:50%;width:4.8rem;height:4.8rem;transform:translate(-50%,-50%);background:#ed1c27}
.f-cu{background:linear-gradient(#002a8f 0 20%,#fff 20% 40%,#002a8f 40% 60%,#fff 60% 80%,#002a8f 80%)}
.f-cu::before{content:'';position:absolute;left:0;top:0;bottom:0;width:48%;background:#cf142b;clip-path:polygon(0 0,100% 50%,0 100%)}
.f-cu b{left:1rem;top:50%;width:3.2rem;height:3.2rem;margin-top:-1.6rem;background:#fff}
.f-su{background:linear-gradient(135deg,#d51a1a,#a80000)}
.f-su b{left:1.6rem;top:1rem;width:2rem;height:2rem}
.f-su i{left:2.6rem;top:3rem;width:3.6rem;height:3.6rem;border:.55rem solid #ffd23c;border-radius:50%;border-right-color:transparent;border-bottom-color:transparent;background:none;clip-path:none;transform:rotate(-25deg)}
.f-su::before{content:'';position:absolute;left:5.7rem;top:3rem;width:.7rem;height:4.2rem;background:#ffd23c;transform:rotate(40deg);border-radius:.2rem}
.f-su::after{content:'';position:absolute;left:4.2rem;top:3rem;width:2.4rem;height:1.1rem;background:#ffd23c;transform:rotate(40deg);border-radius:.2rem}
.f-cn{background:#de2910}
.f-cn b{left:1.6rem;top:1.2rem;width:3.6rem;height:3.6rem}
.f-cn i{width:1.2rem;height:1.2rem}
.f-cn i:nth-of-type(1){left:6.2rem;top:.7rem}
.f-cn i:nth-of-type(2){left:7.7rem;top:2.2rem}
.f-cn i:nth-of-type(3){left:7.7rem;top:4rem}
.f-cn i:nth-of-type(4){left:6.2rem;top:5.5rem}
#rot{position:fixed;inset:0;z-index:99;background:linear-gradient(135deg,#f4f9ff,#cfe2ff);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;font-family:'Sora',system-ui,sans-serif;color:#15305c}
#rot h3{font-size:22px}
#rot p{font-size:15px;color:#566e95;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.ph{width:64px;height:112px;border:5px solid #2f6fdb;border-radius:16px;background:#fff;position:relative;animation:rt 2.8s ease-in-out infinite;box-shadow:0 14px 30px -10px rgba(47,111,219,.5)}
.ph::after{content:'';position:absolute;left:50%;top:8px;width:20px;height:4px;margin-left:-10px;border-radius:4px;background:#9cc4ff}
@keyframes rt{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){.grid,.blob,.p,.ring,.core,.halo{animation:none}}
</style>
</head>

<div class="bg"><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<script>
const I={building:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"/>',factory:'<path d="M2 21V11l6 4v-4l6 4V6h4v15zM2 21h20"/>',truck:'<path d="M1 6h13v10H1zM14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',tag:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6"/><circle cx="17" cy="9" r="2"/><path d="M17 14c3 0 4 2 4 5"/>',down:'<path d="M12 3v18M6 15l6 6 6-6"/>',scale:'<path d="M12 3v18M5 21h14M5 7h14M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z"/>',check:'<path d="M5 12l5 5 9-11"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 00-4-10z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/>',coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10c0-2 6-2 6 0s-6 2-6 4 6 2 6 0"/>',heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/>'};
const sv=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ic=(n,c)=>`<div class="ico ${c||''}">${sv(n)}</div>`;
const btn=t=>`<button class="btn rv" data-go>${t}${sv('arrow')}</button>`;
const head=(t,h)=>`<div class="tag rv"><i></i>${t}</div><h2 class="rv" data-t data-k="30">${h}</h2>`;
const vcards=(a,c)=>a.map(x=>`<div class="card rv"><div class="vh">${ic(x[0])}<h3 data-t data-k="22">${x[1]}</h3></div><p>${x[2]}</p></div>`).join('');const fl={kp:'<b></b><i></i>',cu:'<b></b>',su:'<b></b><i></i>',cn:'<b></b><i></i><i></i><i></i><i></i>'};
const hcards=(a,c)=>a.map(x=>`<div class="card hz rv ${c||''}">${ic(x[0])}<div><h3 data-t data-k="22">${x[1]}</h3><p>${x[2]}</p></div></div>`).join('');
const sl=(c,h)=>`<section class="slide next ${c}">${h}</section>`;
const names=['Nur Fadilah Rezkia','Joshua Rafael Saranga','Federer Leonardus Walter','Elma Aglucia Lupita Rahael','Salwa Dwi Anggaran','Maytreecya Balialo','Achmad Daniswara Javas Muchie'];
const S=[
sl('',`<div class="hero"><div class="hl"><div class="tag rv"><i></i>Presentasi Ekonomi</div><h1 class="rv" data-t data-k="60">Kelompok 2</h1><div class="sub rv" data-t data-k="24">Sistem Ekonomi Komando</div><div class="lab rv">Anggota</div><div class="mem">${names.map(n=>`<div class="chip rv"><span>${sv('user')}</span>${n}</div>`).join('')}</div>${btn('Continue')}</div><div class="orb rv"><div class="ring r1"><div class="nd">${sv('coin')}</div><div class="nd bt">${sv('truck')}</div></div><div class="ring r2"><div class="nd">${sv('factory')}</div><div class="nd bt">${sv('tag')}</div></div><div class="ring r3"><div class="nd">${sv('target')}</div><div class="nd bt">${sv('users')}</div></div><div class="core">${sv('building')}</div></div></div>`),
sl('',`${head('Materi pertama','Pengertian Sistem Ekonomi <em>Komando</em>')}<div class="def"><div class="card big rv"><p data-t data-k="6">Sistem ekonomi komando adalah sistem yang menyerahkan seluruh kegiatan ekonomi, mulai dari produksi, distribusi, hingga penetapan harga, kepada perencanaan dan pengendalian pemerintah pusat. Masyarakat dan pelaku usaha bertugas menjalankan rencana yang sudah ditetapkan, bukan menentukan arah ekonominya sendiri.</p></div><div class="stack">${hcards([['factory','Produksi','Negara menentukan jenis dan jumlah barang yang harus dibuat.'],['truck','Distribusi','Pemerintah mengatur arus barang dari pabrik hingga ke masyarakat.'],['tag','Harga','Harga ditetapkan oleh negara, bukan oleh mekanisme pasar.']])}</div></div>${btn('Continue')}`),
sl('',`${head('Materi kedua','Ciri-ciri Sistem Ekonomi <em>Komando</em>')}<div class="row c3">${vcards([['building','Dikuasai negara','Sumber daya alam, tanah, dan alat produksi utama dimiliki serta dikelola langsung oleh pemerintah.'],['target','Perencanaan terpusat','Jenis, jumlah, dan target produksi ditentukan lewat rencana resmi yang disusun pemerintah pusat.'],['tag','Harga ditetapkan','Harga barang dan jasa diatur oleh negara, bukan terbentuk dari permintaan dan penawaran.'],['scale','Minim persaingan','Pelaku usaha mengikuti arahan negara, sehingga persaingan bebas hampir tidak terjadi.'],['down','Keputusan top-down','Kebijakan ekonomi mengalir dari pemerintah pusat ke daerah, perusahaan, dan masyarakat.'],['users','Peran swasta terbatas','Kepemilikan pribadi atas faktor produksi dan kebebasan membuka usaha sangat dibatasi.']])}</div>${btn('Continue')}`),
sl('',`${head('Materi ketiga','Kelebihan Sistem Ekonomi <em>Komando</em>')}<div class="row c2">${hcards([['scale','Distribusi lebih merata','Barang kebutuhan pokok dapat dibagikan secara adil sehingga kesenjangan antar masyarakat dapat ditekan.'],['tag','Harga relatif stabil','Karena harga dikendalikan pemerintah, gejolak pasar seperti kenaikan harga mendadak dapat diminimalkan.'],['users','Pengangguran rendah','Negara mengatur lapangan kerja dan menempatkan tenaga kerja, sehingga hampir semua orang mendapat pekerjaan.'],['bolt','Prioritas nasional cepat','Proyek besar seperti infrastruktur dan industri berat bisa digerakkan cepat karena keputusan terpusat.']])}</div>${btn('Continue')}`),

];
const app=document.getElementById('app');
app.innerHTML=S.join('');
document.getElementById('lg').innerHTML=sv('building');
const sd=[...app.children];
const dt=document.getElementById('dt');
dt.innerHTML=sd.map(()=>'<i class="dot"></i>').join('');
const dots=[...dt.children];
for(let k=0;k<22;k++){const p=document.createElement('i');p.className='p';const s=4+Math.random()*10;p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${12+Math.random()*16}s;animation-delay:${-Math.random()*20}s`;document.querySelector('.bg').appendChild(p)}
function sp(el){let n=0;el.style.setProperty('--k',(el.dataset.k||32)+'ms');[...el.childNodes].forEach(function f(nd){if(nd.nodeType===3){const fr=document.createDocumentFragment();nd.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){fr.append(' ');n++;return}const w=document.createElement('span');w.className='w';[...p].forEach(ch=>{const c=document.createElement('span');c.className='c';c.textContent=ch;c.style.setProperty('--c',n++);w.append(c)});fr.append(w)});nd.replaceWith(fr)}else[...nd.childNodes].forEach(f)})}
sd.forEach(s=>{s.querySelectorAll('.rv').forEach((e,i)=>e.style.setProperty('--i',i));s.querySelectorAll('[data-t]').forEach(sp)});
let cur=-1,busy=false;
function go(n){cur=n;sd.forEach((s,i)=>{s.classList.toggle('active',i===n);s.classList.toggle('gone',i<n);s.classList.toggle('next',i>n)});dots.forEach((d,i)=>d.classList.toggle('on',i===n));document.getElementById('cn').textContent=String(n+1).padStart(2,'0')+' / '+String(sd.length).padStart(2,'0')}
function step(){if(busy)return;busy=true;setTimeout(()=>busy=false,1500);if(cur>=sd.length-1){sd.forEach(s=>{s.classList.remove('active','gone');s.classList.add('next')});void app.offsetWidth;setTimeout(()=>go(0),60)}else go(cur+1)}
document.addEventListener('click',e=>{if(e.target.closest('[data-go]'))step()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){e.preventDefault();step()}});
document.addEventListener('mousemove',e=>{const c=e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
setTimeout(()=>go(0),200);
</script>
