<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17306b">
<title>Sistem Ekonomi Komando — Kelompok 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{
  height:100%;overflow:hidden;
  background:#0a0e1a;
  font-family:'Press Start 2P',monospace;
  color:#f2f4f8;
  -webkit-font-smoothing:none;
  text-rendering:geometricPrecision;
}

#gl{
  position:fixed;inset:0;
  width:100%;height:100%;
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:pointer;
}

#ui{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:10;
}

#dt{
  position:absolute;left:50%;bottom:24px;
  transform:translateX(-50%);
  display:flex;gap:8px;
}
#dt i{
  display:block;width:6px;height:6px;
  background:rgba(255,255,255,.22);
  transition:background .3s,transform .3s,box-shadow .3s;
}
#dt i.on{
  background:#ffd23f;
  transform:scale(1.6);
  box-shadow:0 0 10px rgba(255,210,63,.8);
}

#cn{
  position:absolute;right:20px;bottom:22px;
  font-size:8px;letter-spacing:.14em;
  color:#8a92a6;
  font-variant-numeric:tabular-nums;
}

#hint{
  position:absolute;left:20px;bottom:22px;
  font-size:8px;letter-spacing:.08em;
  color:#8a92a6;opacity:.75;
  animation:hintPulse 2.4s ease-in-out infinite;
}
@keyframes hintPulse{50%{opacity:.35}}

#vignette{
  position:fixed;inset:0;pointer-events:none;z-index:9;
  background:radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}

#scan{
  position:fixed;inset:0;pointer-events:none;z-index:9;opacity:.10;
  background:repeating-linear-gradient(0deg,
    rgba(255,255,255,.05) 0 1px,
    transparent 1px 3px);
  mix-blend-mode:overlay;
}

#boot{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:#0a0e1a;
  font-size:8px;letter-spacing:.16em;color:#8a92a6;
  transition:opacity .6s ease;
}
#boot.gone{opacity:0;pointer-events:none}

@media(max-width:640px){
  #cn,#hint{font-size:7px;bottom:16px}
  #cn{right:14px}#hint{left:14px}
  #dt{bottom:18px}
}
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="vignette"></div>
<div id="scan"></div>

<div id="ui">
  <div id="dt"></div>
  <div id="cn">01 / 08</div>
  <div id="hint">← → · SWIPE · KLIK</div>
</div>

<div id="boot">MEMUAT…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
