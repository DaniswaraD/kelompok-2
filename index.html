<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Ekonomi Komando - Kelompok 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b4:#5b9cf5;--b5:#2f6fdb;--ink:#15305c;--mut:#566e95}
*{box-sizing:border-box;margin:0}
html{font-size:min(1.62vh,.9vw)}
body{height:100dvh;overflow:hidden;background:#eef5ff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-size:1.2rem}
h1,h2,h3,.tag,.btn,.cnt,.logo{font-family:'Sora','Plus Jakarta Sans',system-ui,sans-serif}
.bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 15% 10%,#fff,transparent 45%),linear-gradient(135deg,#f6faff,#dfecff 55%,#f3f8ff)}
.grid{position:absolute;inset:-10%;background-image:linear-gradient(rgba(91,156,245,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(91,156,245,.13) 1px,transparent 1px);background-size:4rem 4rem;-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 75%);mask-image:radial-gradient(circle,#000 20%,transparent 75%);animation:pan 28s linear infinite}
@keyframes pan{to{transform:translate(4rem,4rem)}}
.blob{position:absolute;border-radius:50%;filter:blur(52px);opacity:.55;animation:fl 14s ease-in-out infinite alternate}
.b1{width:36rem;height:36rem;background:#a9cdff;left:-8rem;top:-10rem}
.b2{width:30rem;height:30rem;background:#cfe2ff;right:-6rem;bottom:-8rem;animation-delay:-5s}
.b3{width:20rem;height:20rem;background:#8fbcff;right:30%;top:10%;opacity:.35;animation-delay:-9s}
@keyframes fl{to{transform:translate(6rem,4rem) scale(1.2)}}
.bg{--s:0}
.blob{translate:calc(var(--s)*var(--px,-5rem)) 0;transition:translate 1.9s cubic-bezier(.16,1,.3,1)}
.b1{--px:-7rem}
.b2{--px:-12rem}
.b3{--px:-4rem}
.grid{background-position:calc(var(--s)*-9rem) 0;transition:background-position 1.9s cubic-bezier(.16,1,.3,1)}
.p{position:absolute;bottom:-2rem;border-radius:50%;background:rgba(91,156,245,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh);opacity:0}}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.6rem max(3.5rem,env(safe-area-inset-right)) 0 max(3.5rem,env(safe-area-inset-left));z-index:5}
.logo{display:flex;align-items:center;gap:.9rem;font-weight:700;font-size:1.25rem}
.lm{width:2.6rem;height:2.6rem;border-radius:.9rem;background:linear-gradient(135deg,#7db4ff,#2f6fdb);display:grid;place-items:center;color:#fff}
.lm svg{width:1.4rem}
.cnt{font-weight:600;font-size:1.15rem;padding:.5rem 1.1rem;border-radius:2rem;background:#fff;border:1px solid #dbe9ff}
.dots{position:fixed;bottom:1.8rem;left:50%;translate:-50% 0;display:flex;gap:.6rem;z-index:5}
.dot{width:.7rem;height:.7rem;border-radius:1rem;background:#b8d2f7;transition:all .6s cubic-bezier(.16,1,.3,1)}
.dot.on{width:2.6rem;background:var(--b5)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5.5rem max(7rem,env(safe-area-inset-right)) 4.5rem max(7rem,env(safe-area-inset-left));pointer-events:none}
.slide.active{pointer-events:auto}
.slide .rv{transition:transform 1.4s cubic-bezier(.4,.2,.2,1),opacity 1s cubic-bezier(.33,1,.68,1),translate .5s cubic-bezier(.16,1,.3,1),box-shadow .5s}
.active .rv,.gone .rv{will-change:transform,opacity}
.active .rv:not(.in){transform:var(--en);opacity:0;transition:none}
.active .rv.in{transform:none;opacity:1;transition-delay:calc(var(--j,0)*var(--st,120ms)),calc(var(--j,0)*var(--st,120ms)),0s,0s}
.next .rv{transform:var(--en);opacity:0;transition:none}
.gone .rv{transform:var(--ex);opacity:0;transition:transform .95s cubic-bezier(.7,0,.25,1),opacity .6s cubic-bezier(.5,0,.75,0),translate .5s cubic-bezier(.16,1,.3,1),box-shadow .5s;transition-delay:calc(var(--i)*55ms),calc(var(--i)*55ms + 150ms),0s,0s}
.t0 .rv{--en:translate3d(75vw,0,0) skewX(-14deg);--ex:translate3d(-75vw,0,0) skewX(14deg)}
.t1 .rv{--en:translate3d(calc(var(--d)*80vw),0,0) rotateZ(calc(var(--d)*3deg));--ex:translate3d(calc(var(--d)*80vw),0,0) rotateZ(calc(var(--d)*-3deg))}
.t2 .rv{--en:perspective(90rem) translate3d(55vw,0,-30rem) rotateY(-40deg);--ex:perspective(90rem) translate3d(-55vw,0,-30rem) rotateY(40deg)}
.t3 .rv{--en:translate3d(-75vw,0,0) skewX(14deg) scale(.92);--ex:translate3d(75vw,0,0) skewX(-14deg) scale(.92)}
.gone .c{opacity:1;animation:xo .9s cubic-bezier(.5,0,.75,0) both;animation-delay:min(calc(var(--k,0)*3ms),.4s)}
.ico{animation:ib 4s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-.45s)}
@keyframes ib{to{transform:translateY(-.4rem) rotate(-6deg)}}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0;transform-origin:50% 100%;backface-visibility:hidden}
.active .rv.in .c{animation-name:var(--fx,f0);animation-duration:.7s;animation-timing-function:cubic-bezier(.22,1,.36,1);animation-delay:var(--dl,0s);animation-fill-mode:both}
.active .rv.in p .c{animation-duration:.55s}
.active .rv.in.wv .c,.active .rv.in .wv .c{animation-name:var(--fx),cs,cb;animation-duration:.85s,1.2s,3.8s;animation-timing-function:cubic-bezier(.22,1,.36,1),ease-in-out,ease-in-out;animation-delay:var(--dl),calc(var(--dl) + 1s + var(--k,0)*40ms),calc(var(--dl) + 2.4s + var(--k,0)*80ms);animation-iteration-count:1,1,infinite;animation-fill-mode:both,none,none}
.wv .c{transition:scale .35s cubic-bezier(.34,1.56,.64,1),color .3s}
.wv .c:hover{scale:1.3;color:var(--b4)}
@keyframes f0{0%{opacity:0;transform:perspective(40rem) translate3d(0,.7em,0) rotateX(-65deg) scale(.92);color:var(--b4)}55%{opacity:1}100%{opacity:1;transform:perspective(40rem) translate3d(0,0,0) rotateX(0) scale(1)}}
@keyframes f1{0%{opacity:0;transform:translate3d(calc(var(--r)*.5em),-1.3em,0) rotate(calc(var(--r)*40deg)) scale(1.6);filter:blur(10px)}60%{opacity:1;transform:translate3d(0,.1em,0) rotate(calc(var(--r)*-6deg)) scale(.95);filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes f2{0%{opacity:0;transform:translate3d(-.9em,0,0) skewX(-28deg);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes f3{0%{opacity:0;transform:translate3d(calc(var(--r)*.25em),.55em,0) scale(.7);filter:blur(5px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes f4{0%{opacity:0;transform:scale(0) rotate(calc(var(--r)*120deg))}60%{opacity:1;transform:scale(1.4) rotate(0)}100%{opacity:1;transform:none}}
@keyframes f5{0%{opacity:0;transform:perspective(40rem) translate3d(0,-.9em,0) rotateY(90deg);color:var(--b4)}100%{opacity:1;transform:none}}
@keyframes cs{50%{color:#7db4ff;text-shadow:0 0 .5em rgba(125,180,255,.9);transform:translate3d(0,-.12em,0) scale(1.12)}}
@keyframes cb{50%{translate:0 -.07em}}
@keyframes xo{0%{opacity:1;transform:none}100%{opacity:0;transform:translate3d(calc(var(--r,0)*.6em),-.9em,0) rotate(calc(var(--r,0)*40deg)) scale(.4);filter:blur(4px)}}
.tag{align-self:flex-start;display:flex;align-items:center;gap:.7rem;padding:.55rem 1.2rem;border-radius:2rem;background:#fff;border:1px solid #dbe9ff;font-weight:600;font-size:1.2rem;color:var(--b5)}
.tag i{width:.6rem;height:.6rem;border-radius:50%;background:var(--b4);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(91,156,245,.6)}100%{box-shadow:0 0 0 .9rem rgba(91,156,245,0)}}
h2{font-size:3.7rem;line-height:1.1;font-weight:800;margin:1rem 0 0;letter-spacing:-.02em}
h2 em{font-style:normal;color:var(--b5)}
.row{display:grid;gap:1.4rem}
.c3{grid-template-columns:repeat(3,1fr)}
.c2{grid-template-columns:repeat(2,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.card{position:relative;background:#fff;border:1px solid #dbe9ff;border-radius:1.55rem;padding:1.65rem;box-shadow:0 1rem 2.5rem -1.25rem rgba(47,111,219,.28),inset 0 0 0 1px rgba(156,196,255,.32);overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(18rem circle at var(--mx,50%) var(--my,0%),rgba(91,156,245,.24),transparent 60%);opacity:0;transition:opacity .3s}
.card::after{content:'';position:absolute;left:0;top:0;height:.28rem;width:34%;background:linear-gradient(90deg,#9cc4ff,#2f6fdb);border-radius:0 0 1rem 0;transition:width .6s cubic-bezier(.16,1,.3,1)}
.card:hover{translate:0 -.32rem;box-shadow:0 1.55rem 3rem -1.2rem rgba(47,111,219,.42),inset 0 0 0 1px rgba(125,180,255,.6)}

.card h3{font-size:1.75rem;margin:0 0 .5rem;font-weight:700;line-height:1.25}

.ico{width:3.7rem;height:3.7rem;flex:none;border-radius:1.2rem;background:linear-gradient(135deg,#7db4ff,#2f6fdb);display:grid;place-items:center;color:#fff;box-shadow:0 .8rem 1.4rem -.5rem rgba(47,111,219,.6)}

.hz{display:flex;gap:1.3rem;align-items:flex-start}
.btn{align-self:flex-end;margin-top:2rem;display:flex;align-items:center;gap:.9rem;padding:1.1rem 2.2rem;border:0;border-radius:3rem;font-size:1.35rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#6aa8ff,#2f6fdb);box-shadow:0 1rem 2rem -.6rem rgba(47,111,219,.6);cursor:pointer;position:relative;overflow:hidden;transition:translate .3s,box-shadow .3s}
.btn svg{width:1.4rem;transition:translate .3s}

.btn:focus-visible{outline:.25rem solid #9cc4ff;outline-offset:.2rem}
.btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 2.8s infinite}
@keyframes sh{to{left:130%}}
.hero{display:flex;align-items:center;gap:4rem;flex:1}
.hl{flex:1.25;display:flex;flex-direction:column;align-items:flex-start}

.sub{font-size:1.9rem;font-weight:600;color:var(--b5);margin-bottom:1.6rem;font-family:'Sora',system-ui,sans-serif}
.lab{font:700 1.3rem 'Sora',system-ui,sans-serif;color:var(--mut);margin-bottom:.8rem}
.mem{--st:200ms;display:grid;grid-template-columns:1fr 1fr;gap:.65rem .85rem;width:100%}
.chip{display:flex;align-items:center;gap:.9rem;padding:.65rem 1.1rem .65rem .65rem;border-radius:1.4rem;background:#fff;border:1px solid #dbe9ff;font-weight:600;font-size:1.25rem;transition:translate .4s,box-shadow .4s}
.chip:hover{translate:0 -.2rem;box-shadow:0 .8rem 1.6rem -.6rem rgba(47,111,219,.45)}

.chip svg{width:1.3rem}
.hl .btn{align-self:flex-start}
.orb{position:relative;width:28rem;height:28rem;flex:none}
.ring{position:absolute;border:1.5px dashed rgba(91,156,245,.55);border-radius:50%;animation:spin var(--d) linear infinite}
.r1{inset:0;--d:40s}
.r2{inset:4rem;--d:28s;animation-direction:reverse}
.r3{inset:8rem;--d:20s}
.nd{position:absolute;left:50%;top:-1.5rem;width:3rem;height:3rem;margin-left:-1.5rem;border-radius:50%;background:#fff;color:var(--b5);display:grid;place-items:center;box-shadow:0 .6rem 1.4rem -.3rem rgba(47,111,219,.45)}
.nd.bt{top:auto;bottom:-1.5rem}
.nd svg{width:1.4rem;animation:spin var(--d) linear infinite reverse}

@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;inset:8rem;display:grid;place-items:center;color:var(--b5);animation:bob 5s ease-in-out infinite}
.core svg{width:3.6rem}

.def{display:grid;grid-template-columns:1.5fr 1fr;gap:1.4rem}
.big{padding:2.4rem 2.6rem;display:flex;flex-direction:column;justify-content:center}

.stack{display:grid;gap:1.2rem}

.vh{display:flex;align-items:center;gap:1.1rem;margin-bottom:1rem}
.vh .ico{width:3.2rem;height:3.2rem;border-radius:1rem}

.vh h3{margin:0}
.badge{display:inline-block;margin-top:1rem;padding:.35rem .95rem;border-radius:2rem;font-size:1.15rem;font-weight:700;background:#e0edff;color:var(--b5);animation:bp 2.4s ease-in-out infinite}

.badge.old{background:#eceff6;color:#5f6f90}
.end{align-items:center;text-align:center;justify-content:center}
.end .tag,.end .btn{align-self:center}
.end h1{font-size:9rem;margin:1.6rem 0 1rem}
.big-ico{width:7rem;height:7rem;border-radius:2.2rem}
.big-ico svg{width:3.4rem}
.halo{position:absolute;left:50%;top:50%;width:46rem;height:46rem;margin:-23rem 0 0 -23rem;border-radius:50%;border:1.5px solid rgba(91,156,245,.4);opacity:0;pointer-events:none}
.active .halo{animation:ex 5s ease-out infinite;animation-delay:calc(var(--h)*1.6s + 1s)}
@keyframes ex{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.flag{position:relative;height:9rem;border-radius:1.2rem;overflow:hidden;margin-bottom:1.2rem;box-shadow:0 .8rem 1.6rem -.6rem rgba(21,48,92,.45),inset 0 0 0 1px rgba(21,48,92,.12);transition:scale .6s cubic-bezier(.16,1,.3,1);animation:wv 3.6s ease-in-out infinite alternate;transform-origin:left center}
@keyframes wv{from{transform:perspective(40rem) rotateY(6deg)}to{transform:perspective(40rem) rotateY(-9deg) rotateX(2deg)}}

.hd{display:flex;align-items:center;justify-content:space-between;gap:2rem;margin-bottom:1.4rem}
.hdl{display:flex;flex-direction:column;align-items:flex-start;flex:1}
