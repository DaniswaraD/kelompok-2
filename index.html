<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Sistem Ekonomi Komando — Kelompok 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --bg-2:#0f1524;
  --ink:#f2f4f8;
  --muted:#8a92a6;
  --gold:#ffd23f;
  --blue:#3d8bff;
  --red:#ff5d5d;
  --green:#4ade80;
  --card:rgba(19,26,46,.72);
  --stroke:rgba(255,255,255,.08);
  --stroke-2:rgba(255,255,255,.18);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ============ STAGE & WORLD (3D) ============ */
.stage{
  position:fixed;inset:0;z-index:1;
  perspective:1800px;
  perspective-origin:50% 50%;
  overflow:hidden;
  background:#050810;
}
.world{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform-origin:50% 50%;
  transition:transform .7s cubic-bezier(.16,1,.3,1);
  will-change:transform;
}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.6) 100%);
}

/* ============ BACKGROUND ============ */
.bg{
  position:absolute;inset:-25%;
  transform:translateZ(-800px);
  transform-style:preserve-3d;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 30%,rgba(61,139,255,.20),transparent 55%),
    radial-gradient(ellipse at 80% 70%,rgba(255,210,63,.14),transparent 55%),
    radial-gradient(ellipse at 50% 50%,#0f1524 0%,#050810 75%);
}
.bg .p{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.5);
  animation:floatUp linear infinite;
  will-change:transform;
}
.bg .p:nth-child(3n){background:rgba(61,139,255,.7);box-shadow:0 0 8px rgba(61,139,255,.8)}
.bg .p:nth-child(3n+2){background:rgba(255,210,63,.65);box-shadow:0 0 8px rgba(255,210,63,.7)}
@keyframes floatUp{
  0%{transform:translate3d(0,0,0) scale(1);opacity:0}
  10%{opacity:.9}
  90%{opacity:.9}
  100%{transform:translate3d(30px,-125vh,220px) scale(1.2);opacity:0}
}

/* ============ SLIDES (3D FLY-THROUGH) ============ */
#app{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform-origin:50% 50%;
}

.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5vmin 5vmin 8vmin;gap:1.4vmin;text-align:center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  will-change:transform,opacity,filter;
  opacity:0;
  transform:translate3d(0,0,-1400px) rotateX(18deg) scale(.5);
  filter:blur(30px) brightness(.3) saturate(.35);
  transition:
    transform 1.2s cubic-bezier(.16,1,.3,1),
    opacity .6s ease,
    filter 1s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
}

.slide.active{
  opacity:1;
  transform:translate3d(0,0,0) rotateX(0) scale(1);
  filter:blur(0) brightness(1) saturate(1);
  pointer-events:auto;
}

.slide.gone{
  opacity:0;
  transform:translate3d(0,0,1000px) rotateX(-28deg) scale(1.75);
  filter:blur(45px) brightness(1.7) saturate(1.5);
  transition:
    transform .95s cubic-bezier(.7,0,.84,0),
    opacity .55s ease-in .15s,
    filter .85s ease-in;
}

.slide.next{
  opacity:0;
  transform:translate3d(0,0,-1400px) rotateX(18deg) scale(.5);
  filter:blur(30px) brightness(.3) saturate(.35);
}

/* ============ TYPOGRAPHY ============ */
.slide h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(52px,10.5vmin,140px);
  letter-spacing:-.03em;line-height:.95;
  background:linear-gradient(180deg,#fff 0%,#c8cfdd 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.slide h2{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(28px,5vmin,62px);
  letter-spacing:-.015em;line-height:1.08;
  max-width:24ch;margin:0 auto;
}
.slide h2 em{font-style:italic;color:var(--gold);position:relative}
.slide h3{
  font-family:var(--sans);font-weight:600;
  font-size:clamp(13px,1.6vmin,17px);
  letter-spacing:-.005em;color:var(--ink);
}
.slide p{
  font-size:clamp(12.5px,1.5vmin,16px);
  line-height:1.68;color:var(--muted);font-weight:400;
}
.slide .sub{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(18px,3vmin,38px);
  color:var(--gold);letter-spacing:-.01em;
}

.tag{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 16px;border:1px solid var(--stroke-2);border-radius:999px;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);background:rgba(255,255,255,.03);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-weight:500;
}
.tag i{
  width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 14px var(--gold);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.35;transform:scale(.65)}}

.lab{
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);opacity:.65;margin-top:2vmin;font-weight:500;
}

/* ============ HERO ============ */
.s-hero h1{margin:1vmin 0}
.s-hero .sub{margin-top:-1vmin}
.mem{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  max-width:min(90vw,960px);margin-top:.5vmin;
}
.chip{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 15px 7px 7px;
  background:var(--card);border:1px solid var(--stroke);
  border-radius:999px;font-size:11.5px;color:var(--ink);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-weight:500;letter-spacing:-.005em;
}
.chip .ci{
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--blue),var(--gold));
  border-radius:50%;color:#0a0e1a;flex-shrink:0;
}
.chip .ci svg{width:12px;height:12px}

/* ============ BUTTON ============ */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 26px;margin-top:2.2vmin;
  background:var(--ink);color:var(--bg);
  border-radius:999px;font-size:13px;font-weight:600;
  letter-spacing:.005em;
  transition:transform .35s cubic-bezier(.16,1,.3,1),background .3s,box-shadow .35s,color .3s;
  box-shadow:0 14px 34px -14px rgba(255,210,63,.55);
}
.btn svg{width:15px;height:15px;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.btn:hover{background:var(--gold);transform:translateY(-2px);box-shadow:0 22px 44px -14px rgba(255,210,63,.7)}
.btn:hover svg{transform:translateX(4px)}
.btn:active{transform:translateY(0) scale(.98)}

/* ============ CARDS & LAYOUT ============ */
.def{
  display:grid;gap:1.4vmin;width:min(92vw,1100px);
  margin-top:1.6vmin;transform-style:preserve-3d;
}
.def .big{
  padding:2.6vmin 3vmin;
  background:var(--card);border:1px solid var(--stroke);
  border-radius:20px;text-align:left;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.6);
}
.def .big p{
  font-size:clamp(13.5px,1.7vmin,18px);
  line-height:1.72;color:#c8cfdd;
}

.stack{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vmin}

.card{
  padding:2vmin;
  background:var(--card);border:1px solid var(--stroke);
  border-radius:16px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  text-align:left;
  display:flex;flex-direction:column;gap:9px;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.16,1,.3,1),border-color .35s,background .35s,box-shadow .35s;
  will-change:transform;
  box-shadow:0 20px 40px -24px rgba(0,0,0,.55);
}
.card:hover{
  border-color:var(--stroke-2);
  background:rgba(24,32,54,.85);
  box-shadow:0 30px 60px -24px rgba(0,0,0,.75);
}
.card p{font-size:clamp(11.5px,1.35vmin,14px);line-height:1.62}
.card .vh{display:flex;align-items:center;gap:10px}

.ico{
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  border-radius:11px;
  background:linear-gradient(135deg,rgba(61,139,255,.22),rgba(255,210,63,.14));
  color:var(--gold);border:1px solid var(--stroke);flex-shrink:0;
}
.ico svg{width:20px;height:20px}
.ico.big-ico{width:68px;height:68px;border-radius:22px}
.ico.big-ico svg{width:34px;height:34px}

.row{
  display:grid;gap:1.2vmin;width:min(92vw,1100px);
  margin-top:1.4vmin;transform-style:preserve-3d;
}
.row.c3{grid-template-columns:repeat(3,1fr)}
.row.c2{grid-template-columns:repeat(2,1fr)}
.row.c4{grid-template-columns:repeat(4,1fr)}

.card.hz{flex-direction:row;align-items:flex-start;gap:12px}
.card.hz .ico{margin-top:2px}
.card.hz>div{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.card.neg .ico{
  color:var(--red);
  background:linear-gradient(135deg,rgba(255,93,93,.22),rgba(255,93,93,.05));
}

.badge{
  display:inline-block;padding:4px 10px;border-radius:999px;
  font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;
  background:rgba(74,222,128,.14);color:var(--green);
  border:1px solid rgba(74,222,128,.3);
  align-self:flex-start;margin-top:auto;
}
.badge.old{
  background:rgba(255,210,63,.13);color:var(--gold);
  border-color:rgba(255,210,63,.3);
}

/* ============ FLAGS (CSS) ============ */
.flag{
  width:100%;height:52px;border-radius:9px;overflow:hidden;
  position:relative;border:1px solid var(--stroke);
  margin-bottom:6px;flex-shrink:0;
}
.flag b,.flag i{position:absolute;display:block}

.f-kp{background:#024fa2}
.f-kp b{
  left:14%;top:50%;transform:translate(-50%,-50%);
  width:34%;height:58%;border-radius:50%;background:#ed1c27;
}
.f-kp b::after{
  content:"";position:absolute;left:22%;top:50%;transform:translateY(-50%);
  width:70%;height:60%;background:#fff;
  clip-path:polygon(0 50%,100% 0,100% 100%);
}

.f-cu{background:repeating-linear-gradient(0deg,#fff 0 8px,#0033a0 8px 16px)}
.f-cu::before{
  content:"";position:absolute;left:0;top:0;width:34%;height:58%;
  background:#cf142b;clip-path:polygon(0 0,100% 50%,0 100%);z-index:2;
}
.f-cu::after{
  content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;
  background:#fff;z-index:3;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}

.f-su{background:#cc0000}
.f-su b{
  left:0;top:0;width:36%;height:52%;background:#ffd700;
}
.f-su b::after{
  content:"★";position:absolute;left:0;right:0;top:6%;text-align:center;
  color:#cc0000;font-size:15px;line-height:1;
}

.f-cn{background:#de2910}
.f-cn b{
  left:14%;top:50%;transform:translateY(-50%);
  width:20px;height:20px;background:#ffde00;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
.f-cn i{
  width:7px;height:7px;background:#ffde00;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
}
.f-cn i:nth-child(2){left:32%;top:18%}
.f-cn i:nth-child(3){left:38%;top:30%}
.f-cn i:nth-child(4){left:38%;top:44%}
.f-cn i:nth-child(5){left:32%;top:56%}

/* ============ END SLIDE ============ */
.s-end{position:relative;overflow:hidden}
.s-end .halo{
  position:absolute;top:50%;left:50%;border-radius:50%;
  border:1px solid rgba(255,210,63,.25);pointer-events:none;
  transform:translate(-50%,-50%);
  animation:haloOut 4s ease-out infinite;
}
.s-end .halo:nth-child(1){width:50vmin;height:50vmin;animation-delay:0s}
.s-end .halo:nth-child(2){width:70vmin;height:70vmin;animation-delay:1s}
.s-end .halo:nth-child(3){width:90vmin;height:90vmin;animation-delay:2s}
@keyframes haloOut{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:.8}
  100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}
}
.s-end .hi{display:flex;justify-content:center;margin-bottom:1vmin}
.s-end h1{font-size:clamp(48px,9vmin,120px)}

/* ============ UI (dots, counter, logo) ============ */
#dt{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;gap:9px;z-index:30;
}
#dt .dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,.18);
  transition:background .35s,transform .35s,box-shadow .35s;
}
#dt .dot.on{
  background:var(--gold);transform:scale(1.5);
  box-shadow:0 0 14px rgba(255,210,63,.8);
}

#cn{
  position:fixed;right:22px;bottom:20px;
  font-size:11px;letter-spacing:.16em;
  color:var(--muted);font-weight:500;z-index:30;
  font-variant-numeric:tabular-nums;
}

#lg{
  position:fixed;left:22px;bottom:20px;
  color:var(--gold);z-index:30;opacity:.85;
}
#lg svg{width:22px;height:22px}

/* ============ GRAIN OVERLAY ============ */
.fx{
  position:fixed;inset:0;width:100%;height:100%;
  mix-blend-mode:overlay;opacity:.08;
  pointer-events:none;z-index:40;
  animation:grainMove .7s steps(5) infinite;
}
@keyframes grainMove{
  0%{background-position:0 0}
  25%{background-position:-32px 18px}
  50%{background-position:18px -32px}
  75%{background-position:-16px -16px}
  100%{background-position:32px 32px}
}

/* ============ CHARACTERS (3D per-letter) ============ */
.c{display:inline-block;opacity:0;will-change:transform,opacity,filter}
.rv.in .c{
  animation:charFly .95s cubic-bezier(.34,1.15,.64,1) forwards;
  animation-delay:var(--dl, 0ms);
}
@keyframes charFly{
  0%{
    opacity:0;
    transform:translate3d(0,85px,-460px) rotateX(-90deg) rotateZ(calc(var(--r,0) * 22deg));
    filter:blur(10px);
  }
  55%{opacity:1}
  100%{
    opacity:1;
    transform:translate3d(0,0,0) rotateX(0) rotateZ(0);
    filter:blur(0);
  }
}

/* ============ REVEAL WRAPPER ============ */
.rv{
  opacity:0;
  transform:translate3d(0,60px,-220px) rotateX(-32deg);
  filter:blur(6px);
  transition:
    opacity .7s ease,
    transform 1.05s cubic-bezier(.16,1,.3,1),
    filter .8s ease;
  transition-delay:calc(var(--j,0) * 90ms);
  will-change:transform,opacity,filter;
}
.rv.in{
  opacity:1;
  transform:translate3d(0,0,0) rotateX(0);
  filter:blur(0);
}

.slide.gone .rv{
  transition:
    transform .6s cubic-bezier(.7,0,.84,0),
    opacity .35s ease .1s,
    filter .5s ease;
  opacity:0;
  transform:translate3d(0,-50px,320px) rotateX(28deg);
  filter:blur(8px);
}

/* ============ LITE MODE ============ */
html.lite .slide{transition-duration:.45s}
html.lite .c{animation-duration:.35s}
html.lite .stage{perspective:1000px}
html.lite .fx,
html.lite .bg .p,
html.lite .s-end .halo{display:none}
html.lite .card{transform:none!important}
html.lite .rv{transition-duration:.4s}

/* ============ RESPONSIVE ============ */
@media(max-width:860px){
  .def .stack,
  .row.c3,.row.c2,.row.c4{grid-template-columns:1fr}
  .slide{padding:4vmin 4vmin 9vmin;gap:1.2vmin}
  .chip{font-size:10.5px;padding:6px 12px 6px 6px}
  .chip .ci{width:20px;height:20px}
  #dt{bottom:14px;gap:7px}
  #dt .dot{width:7px;height:7px}
  #cn{right:14px;bottom:14px;font-size:10px}
  #lg{left:14px;bottom:14px}
  #lg svg{width:18px;height:18px}
}
@media(max-height:560px){
  .slide{padding:3vmin 4vmin 7vmin;gap:1vmin}
  .def .big{padding:2vmin 2.4vmin}
  .card{padding:1.5vmin}
  .btn{padding:11px 20px;font-size:12px;margin-top:1.2vmin}
  .lab{margin-top:.8vmin}
  .slide h2{font-size:clamp(22px,4vmin,44px)}
  .chip{font-size:10px}
}

/* ============ CLICK RIP ============ */
.rip{
  position:fixed;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--gold);pointer-events:none;z-index:100;
  transform:translate(-50%,-50%);
  animation:ripOut 1.1s cubic-bezier(.16,1,.3,1) forwards;
  box-shadow:0 0 20px rgba(255,210,63,.6);
}
@keyframes ripOut{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
  100%{transform:translate(-50%,-50%) scale(22);opacity:0}
}
</style>
</head>
<body>

<div class="stage">
  <div class="world" id="world">
    <div class="bg" id="bg"></div>
    <div id="app"></div>
  </div>
</div>

<div class="fx" id="fx"></div>
<div id="dt"></div>
<span id="cn">01 / 08</span>
<div id="lg"></div>

<script>
/* =====================================================
   ICONS
===================================================== */
const I = {
  building:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"/>',
  factory:'<path d="M2 21V11l6 4v-4l6 4V6h4v15zM2 21h20"/>',
  truck:'<path d="M1 6h13v10H1zM14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  tag:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6"/><circle cx="17" cy="9" r="2"/><path d="M17 14c3 0 4 2 4 5"/>',
  down:'<path d="M12 3v18M6 15l6 6 6-6"/>',
  scale:'<path d="M12 3v18M5 21h14M5 7h14M5 7l-3 7a3 3 0 006 0zM19 7l-3 7a3 3 0 006 0z"/>',
  check:'<path d="M5 12l5 5 9-11"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 00-4-10z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10c0-2 6-2 6 0s-6 2-6 4 6 2 6 0"/>',
  heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/>'
};
const sv = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const ic = (n,c) => `<div class="ico ${c||''}">${sv(n)}</div>`;
const btn = t => `<button class="btn" data-go>${t}${sv('arrow')}</button>`;

/* =====================================================
   NAMES
===================================================== */
const names = [
  'Nur Fadilah Rezkia',

/* =====================================================
   MOUNT
===================================================== */
const app = document.getElementById('app');
app.innerHTML = S.join('');
document.getElementById('lg').innerHTML = sv('building');

const sd = [...app.children];
const dt = document.getElementById('dt');
dt.innerHTML = sd.map(()=>'<i class="dot"></i>').join('');
const dots = [...dt.children];

/* =====================================================
   BACKGROUND PARTICLES
===================================================== */
const bg = document.getElementById('bg');
for(let k=0;k<24;k++){
  const p = document.createElement('i');
  const s = 2 + Math.random()*4;
  p.className = 'p';
  p.style.cssText = `
    left:${Math.random()*100}%;
    bottom:-10%;
    width:${s}px;height:${s}px;
    animation-duration:${18+Math.random()*26}s;
    animation-delay:${-Math.random()*30}s;
  `;
  bg.appendChild(p);
}

/* =====================================================
   GRAIN NOISE
===================================================== */
(function makeGrain(){
  const n = document.createElement('canvas');
  n.width = n.height = 64;
  const nx = n.getContext('2d');
  const id = nx.createImageData(64,64);
  for(let i=0;i<id.data.length;i+=4){
    const v = Math.random()*255;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;
    id.data[i+3]=255;
  }
  nx.putImageData(id,0,0);
  const fx = document.getElementById('fx');
  fx.style.backgroundImage = `url(${n.toDataURL()})`;
  fx.style.backgroundSize = '128px 128px';
})();

/* =====================================================
   SPLIT TEXT INTO CHARS
===================================================== */
const sel = 'h1,h2,h3,p,.sub,.lab,.tag,.chip,.badge,.btn';

function split(el){
  if(el.matches('.btn,.chip,.tag')){
    [...el.childNodes].forEach(q=>{
      if(q.nodeType===3 && q.textContent.trim()){
        const w = document.createElement('span');
        q.replaceWith(w);
        w.append(q);
      }
    });
  }
  [...el.childNodes].forEach(function f(nd){
    if(nd.nodeType === 3){
      const fr = document.createDocumentFragment();
      nd.textContent.split(/(\s+)/).forEach(part=>{
        if(!part) return;
        if(/^\s+$/.test(part)){ fr.append(' '); return; }
        const w = document.createElement('span');
        w.className = 'w';
        [...part].forEach(ch=>{
          const c = document.createElement('span');
          c.className = 'c';
          c.style.setProperty('--r', (Math.random()*2-1).toFixed(2));
          c.textContent = ch;
          w.append(c);
        });
        fr.append(w);
      });
      nd.replaceWith(fr);
    } else if(nd.nodeType === 1){
      [...nd.childNodes].forEach(f);
    }
  });
}

/* =====================================================
   TIMING (per-character delays)
===================================================== */
function timing(rv){
  const list = [...(rv.matches(sel)?[rv]:[]), ...rv.querySelectorAll(sel)]
    .filter(e=>e.querySelector('.c'));
  let off = 0;
  list.forEach(el=>{
    const cs = el.querySelectorAll('.c');
    const n = cs.length;
    const isP = el.matches('p');
    const isH = el.matches('h1,h2,.sub');
    const cap = isP ? (rv.matches('.big') ? 3600 : 2000) : isH ? 1500 : 900;
    const per = isP ? 18 : isH ? 55 : 38;
    const tot = Math.min(cap, n * per);
    const st = tot / Math.max(n,1);
    cs.forEach((c,i)=>{
      c.style.setProperty('--dl',
        `calc(${(off + i*st).toFixed(1)}ms)`);
    });
    off += tot + (isP ? 0 : 90);
  });
  rv._dur = Math.min(off, 600);
}

/* =====================================================
   PREPARE ALL SLIDES (lazy split — only layout now)
===================================================== */
sd.forEach(s=>{
  s.querySelectorAll(sel).forEach(split);
  s.querySelectorAll('.rv').forEach(timing);
});

/* =====================================================
   REVEAL PLANNER
===================================================== */
let tm = [];
const clr = () => { tm.forEach(clearTimeout); tm = []; };

const rk = k => k[0]==='a'?0 : k[0]==='c'?1 : k[0]==='z'?2 : 3;
const key = (e,i) => {
  if(e.matches('.tag,h1,h2,.sub,.hi')) return 'a';
  if(e.matches('.btn')) return 'z';
  if(e.matches('.lab,.chip')) return 'c';
  return 'k' + i;
};

function plan(s){
  const g = {};
  s.querySelectorAll('.rv').forEach((e,i)=>{
    const k = key(e,i);
    (g[k] = g[k] || []).push(e);
  });
  const o = [];
  Object.keys(g).sort((a,b)=>rk(a)-rk(b)).forEach((k,x)=>{
    const els = g[k];
    const d = Math.max(0, ...els.map(e => e._dur || 0));
    const tx = els.some(e => e.querySelector('.c'));
    const prev = o[x-1];
    const at = x===0 ? 300 :
               x===1 ? o[0].at + 750 :
               (k[0]==='k' && prev.k[0]==='k') ? prev.at + 200 :
               prev.end;
    const st = els.some(e => e.matches('.chip')) ? 200 : 120;
    o.push({
      k, els, at,
      end: at + (tx ? 350 + (els.length-1)*st + d + 600 : 300)
    });
  });
  o.forEach(u=>{
    tm.push(setTimeout(()=>{
      u.els.forEach((e,j)=>{
        e.style.setProperty('--j', j);
        e.classList.add('in');
      });
    }, u.at));
  });
}

/* =====================================================
   NAVIGATION
===================================================== */
let cur = -1;
let busy = false;

const cnEl = document.getElementById('cn');

function go(n){
  cur = n;
  clr();
  sd.forEach((s,i)=>{
    if(i>=n){
      s.querySelectorAll('.in').forEach(e=>e.classList.remove('in'));
    }
  });
  sd.forEach((s,i)=>{
    s.classList.toggle('active', i===n);
    s.classList.toggle('gone',   i<n);
    s.classList.toggle('next',   i>n);
  });
  dots.forEach((d,i)=>d.classList.toggle('on', i===n));
  cnEl.textContent =
    String(n+1).padStart(2,'0') + ' / ' + String(sd.length).padStart(2,'0');
  plan(sd[n]);
}

function step(dir){
  if(busy) return;
  busy = true;
  const forward = dir !== -1;
  const target = forward ? cur + 1 : cur - 1;

  if(target < 0){ busy = false; return; }

  const c = sd[cur];
  const n = c.querySelectorAll('.rv').length;
  const exitDelay = Math.min(700, (n-1)*45 + 400);

  c.classList.remove('active');
  c.classList.add(forward ? 'gone' : 'next');

  setTimeout(()=>{
    if(target >= sd.length){
      /* restart */
      sd.forEach(x=>{
        x.classList.remove('active','gone');
        x.classList.add('next');
        x.querySelectorAll('.in').forEach(e=>e.classList.remove('in'));
      });
      void app.offsetWidth;
      go(0);
    } else {
      if(!forward){
        /* coming from back — reset target's classes first */
        sd[target].classList.remove('gone');
      }
      go(target);
    }
    setTimeout(()=>busy = false, 750);
  }, exitDelay);
}

/* =====================================================
   CLICK & KEYBOARD
===================================================== */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-go]');
  if(!b || busy) return;
  const r = b.getBoundingClientRect();
  const o = document.createElement('i');
  o.className = 'rip';
  o.style.cssText = `left:${r.left+r.width/2}px;top:${r.top+r.height/2}px`;
  document.body.appendChild(o);
  setTimeout(()=>o.remove(), 1200);
  step(1);
});

document.addEventListener('keydown', e=>{
  if(busy) return;
  if(e.key==='ArrowRight' || e.key==='Enter' || e.key===' '){
    e.preventDefault();
    step(1);
  }
  if(e.key==='ArrowLeft'){
    e.preventDefault();
    step(-1);
  }
  if(e.key==='l' || e.key==='L'){
    document.documentElement.classList.toggle('lite');
  }
});

/* =====================================================
   PARALLAX 3D (mouse)
===================================================== */
const world = document.getElementById('world');
let mx = innerWidth/2, my = innerHeight/2;
let tx = 0, ty = 0, cx = 0, cy = 0;

document.addEventListener('mousemove', e=>{
  mx = e.clientX;
  my = e.clientY;
  tx = (mx / innerWidth  - .5) * 5;      /* rotate Y max ±2.5° */
  ty = (my / innerHeight - .5) * -5;     /* rotate X max ±2.5° */
});

/* touch parallax */
document.addEventListener('touchmove', e=>{
  if(!e.touches[0]) return;
  const t = e.touches[0];
  tx = (t.clientX / innerWidth  - .5) * 5;
  ty = (t.clientY / innerHeight - .5) * -5;
},{passive:true});

(function loop(){
  cx += (tx - cx) * .08;
  cy += (ty - cy) * .08;
  world.style.transform = `rotateX(${cy.toFixed(3)}deg) rotateY(${cx.toFixed(3)}deg)`;
  requestAnimationFrame(loop);
})();

/* =====================================================
   CARD 3D TILT (per-card, 2-axis)
===================================================== */
let pe = null;
document.addEventListener('mousemove', e=>{ pe = e.target; });

(function tilt(){
  if(pe && pe.closest){
    const c = pe.closest('.card');
    if(c){
      const r = c.getBoundingClientRect();
      const ux = ((pe.clientX - r.left) / r.width  - .5);
      const uy = ((pe.clientY - r.top ) / r.height - .5);
      c.style.setProperty('--ry', ( ux * 10).toFixed(2) + 'deg');
      c.style.setProperty('--rx', (-uy * 10).toFixed(2) + 'deg');
      c.style.transform =
        `perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0)`;
    }
  }
  document.querySelectorAll('.card').forEach(c=>{
    const r = c.getBoundingClientRect();
    const inside = pe && r.left<=pe.clientX && pe.clientX<=r.right &&
                   r.top <=pe.clientY && pe.clientY<=r.bottom;
    if(!inside && c.style.transform){
      c.style.transform = 'perspective(900px) rotateX(0) rotateY(0)';
    }
  });
  requestAnimationFrame(tilt);
})();

/* =====================================================
   FPS GUARD → lite mode
===================================================== */
let fc = 0, ft = performance.now(), low = 0;
(function fps(){
  fc++;
  const now = performance.now();
  if(now - ft >= 1000){
    const fps = fc * 1000 / (now - ft);
    fc = 0; ft = now;
    if(!document.hidden && fps < 40){
      if(++low >= 3){
        document.documentElement.classList.add('lite');
      }
    } else low = 0;
  }
  requestAnimationFrame(fps);
})();

/* =====================================================
   START
===================================================== */
setTimeout(()=>go(0), 200);
</script>
